name: Auto-merge

on:
  pull_request:
    types: [labeled]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.labels.*.name == 'ready-to-merge'
    steps:
      - name: Auto-merge PR
        uses: pascalcamburn/auto-merge-action@release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          method: merge
          condition: always